name: Build Android release APKs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android release
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_MYAPP_UPLOAD_STORE_FILE: q-music-release.keystore
      ORG_GRADLE_PROJECT_MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      ORG_GRADLE_PROJECT_MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"

      - name: Install dependencies
        run: npm ci

      - name: Lint source
        run: npm run lint

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_STORE_FILE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$ORG_GRADLE_PROJECT_MYAPP_UPLOAD_STORE_PASSWORD"
          test -n "$ORG_GRADLE_PROJECT_MYAPP_UPLOAD_KEY_ALIAS"
          test -n "$ORG_GRADLE_PROJECT_MYAPP_UPLOAD_KEY_PASSWORD"

      - name: Build signed release APKs
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_STORE_FILE_BASE64 }}
        run: |
          keystore_path="android/app/q-music-release.keystore"
          trap 'rm -f "$keystore_path"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          npm run pack:android

      - name: Generate checksums
        shell: bash
        run: |
          cd android/app/build/outputs/apk/release
          sha256sum Q-music-android-v*.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: q-music-android-release
          path: android/app/build/outputs/apk/release/Q-music-android-v*.apk
          if-no-files-found: error
